# G-27 example overlay: replace tags with digests from scripts/pin-image-digests.sh.
#
# Usage:
#   1. Ensure images are pulled/built: docker compose --profile full pull (and build locals)
#   2. Capture digests:  bash scripts/pin-image-digests.sh
#      → writes docs/evidence/image-digests-<UTC>.txt
#   3. Copy this file to docker-compose.digests.yml (gitignored) and substitute
#      @sha256:… values from that evidence file (including any REPLACE_AFTER_PIN).
#   4. Run with: docker compose -f docker-compose.yml -f docker-compose.digests.yml …
#
# Notes (2026-10-31):
# - Latest capture: docs/evidence/image-digests-20261031T124646Z.txt
# - Digests below are from that capture where available; REPLACE_AFTER_PIN marks
#   images that still need a local pull/build before pinning.
# - Service keys match docker-compose.yml names.
# - This file is documentation / starter overlay only — not a verified supply-chain
#   gate (see docs/evidence/supply-chain-status.md). CI Semgrep/Trivy/SBOM remain
#   continue-on-error until a green advisory run is recorded.

[project]
name = "care-companion"
version = "0.1.0"
description = "Sahyog Care Companion workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/py-common", "services/*"]

[dependency-groups]
eval = [
  "ragas>=0.2,<1",
  "deepeval>=2,<4",
  "langchain-openai>=0.3,<2",
  "litellm>=1.106,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "types-pyyaml>=6.0",
  "import-linter>=2.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/py-common/tests", "services"]
pythonpath = ["apps/api", "packages/py-common", "services/abdm-stub", "services/mcp-external"]
asyncio_mode = "auto"
addopts = "-q -m 'not integration'"
markers = [
  "integration: requires Postgres and other running services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
"**/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.importlinter]
root_packages = ["app", "sahyog_common"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "API core must not import modules"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.integrations", "app.agents", "app.repositories"]

[[tool.importlinter.contracts]]
name = "Modules must not import adapters or integrations"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.integrations"]

[[tool.importlinter.contracts]]
name = "Agents must not import integration SDK adapters"
type = "forbidden"
source_modules = ["app.agents"]
forbidden_modules = ["app.integrations"]

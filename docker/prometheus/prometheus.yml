global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]

  - job_name: mcp-broker
    metrics_path: /healthz
    static_configs:
      - targets: ["mcp-broker:8100"]

  # G-30: ARQ job_runs last-success / failure counters from the API.
  - job_name: sahyog-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  # Host-app / --local mode: API listens on the Docker host, not service DNS "api".
  - job_name: sahyog-api-host
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5706"]

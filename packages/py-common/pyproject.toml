[project]
name = "sahyog-common"
version = "0.1.0"
description = "Shared configuration, context, provenance, logging and telemetry for Sahyog services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "fastapi>=0.115,<1",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sahyog_common"]

apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: sahyog
    sahyog.io/zone: ai
spec:
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: sahyog
    sahyog.io/zone: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/part-of: sahyog
        sahyog.io/zone: ai
    spec:
      serviceAccountName: sahyog-workload
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.106.3
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /app/config/litellm.yaml
            - --port
            - "4000"
            - --num_workers
            - "1"
          env:
            - name: HOME
              value: /tmp
            - name: LITELLM_LOG
              value: INFO
            - name: STORE_MODEL_IN_DB
              value: "false"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: sahyog-secrets
                  key: LITELLM_MASTER_KEY
            - name: LITELLM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sahyog-secrets
                  key: LITELLM_DATABASE_URL
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sahyog-secrets
                  key: OPENROUTER_API_KEY
            - name: MCP_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sahyog-secrets
                  key: MCP_SERVICE_TOKEN
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: sahyog-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_CHAT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: sahyog-config
                  key: OLLAMA_CHAT_MODEL
            - name: OLLAMA_SMALL_MODEL
              valueFrom:
                configMapKeyRef:
                  name: sahyog-config
                  key: OLLAMA_SMALL_MODEL
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: tmp
          emptyDir: {}

# Example Secret. Do NOT apply this file: every value is a placeholder.
#
# Preferred production path: mount secrets from a secret manager via CSI/agent.
# Pilot path:
#   ./scripts/k8s-deploy.sh --overlay pilot --create-secret-from-env --confirm
# or create sahyog-secrets yourself with kubectl from a vault.
#
# The application containers list sahyog-secrets first and sahyog-config second,
# so non-secret hostnames in the ConfigMap win over any compose-oriented value
# copied from .env.
apiVersion: v1
kind: Secret
metadata:
  name: sahyog-secrets
  namespace: sahyog
  labels:
    app.kubernetes.io/part-of: sahyog
type: Opaque
stringData:
  # Database and identity bootstrap
  POSTGRES_PASSWORD: REPLACE_POSTGRES_PASSWORD
  DATABASE_URL: postgresql+asyncpg://sahyog:REPLACE_POSTGRES_PASSWORD@postgres:5432/sahyog
  LITELLM_DB_PASSWORD: REPLACE_LITELLM_DB_PASSWORD
  LITELLM_DATABASE_URL: postgresql://litellm:REPLACE_LITELLM_DB_PASSWORD@postgres:5432/litellm
  LANGFUSE_DB_PASSWORD: REPLACE_LANGFUSE_DB_PASSWORD
  LANGFUSE_DATABASE_URL: postgresql://langfuse:REPLACE_LANGFUSE_DB_PASSWORD@postgres:5432/langfuse
  KEYCLOAK_DB_PASSWORD: REPLACE_KEYCLOAK_DB_PASSWORD
  KEYCLOAK_ADMIN_PASSWORD: REPLACE_KEYCLOAK_ADMIN_PASSWORD
  KEYCLOAK_ADMIN_CLIENT_SECRET: REPLACE_KEYCLOAK_ADMIN_CLIENT_SECRET
  KEYCLOAK_CLI_CLIENT_SECRET: REPLACE_KEYCLOAK_CLI_CLIENT_SECRET
  KEYCLOAK_MCP_CLIENT_SECRET: REPLACE_KEYCLOAK_MCP_CLIENT_SECRET

  # Application and agent security
  APP_SECRET_KEY: REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS
  PII_TOKEN_SECRET: REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS
  MCP_CONTEXT_SECRET: REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS
  MCP_SERVICE_TOKEN: REPLACE_WITH_SERVICE_TOKEN
  LITELLM_MASTER_KEY: REPLACE_WITH_LONG_RANDOM_KEY

  # Object storage
  S3_ACCESS_KEY: REPLACE_S3_ACCESS_KEY
  S3_SECRET_KEY: REPLACE_S3_SECRET_KEY
  MINIO_ROOT_USER: REPLACE_MINIO_ROOT_USER
  MINIO_ROOT_PASSWORD: REPLACE_MINIO_ROOT_PASSWORD

  # Telemetry and dashboards
  LANGFUSE_NEXTAUTH_SECRET: REPLACE_WITH_LONG_RANDOM_VALUE
  LANGFUSE_SALT: REPLACE_WITH_LONG_RANDOM_VALUE
  LANGFUSE_ENCRYPTION_KEY: REPLACE_WITH_64_HEX_CHARACTERS
  GRAFANA_ADMIN_PASSWORD: REPLACE_GRAFANA_ADMIN_PASSWORD

  # Providers and channels. Leave empty when the channel is not approved.
  OPENROUTER_API_KEY: ""
  SMTP_PASSWORD: ""
  SLACK_BOT_TOKEN: ""
  SMS_API_KEY: ""
  FHIR_CLIENT_SECRET: ""

  # Seed and operator actions
  SEED_DEMO_PASSWORD: REPLACE_WITH_12_PLUS_CHARACTERS
  ADD_USER_PASSWORD: REPLACE_WITH_12_PLUS_CHARACTERS

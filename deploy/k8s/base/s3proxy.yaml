apiVersion: v1
kind: Service
metadata:
  name: s3proxy
  labels:
    app.kubernetes.io/name: s3proxy
    app.kubernetes.io/part-of: sahyog
    sahyog.io/zone: data
spec:
  selector:
    app.kubernetes.io/name: s3proxy
  ports:
    - name: s3
      port: 80
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3proxy
  labels:
    app.kubernetes.io/name: s3proxy
    app.kubernetes.io/part-of: sahyog
    sahyog.io/zone: data
spec:
  serviceName: s3proxy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3proxy
        app.kubernetes.io/part-of: sahyog
        sahyog.io/zone: data
    spec:
      serviceAccountName: sahyog-workload
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3proxy
          image: andrewgaul/s3proxy:2.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: S3PROXY_ENDPOINT
              value: http://0.0.0.0:80
            - name: S3PROXY_AUTHORIZATION
              value: aws-v4
            - name: S3PROXY_IDENTITY
              valueFrom:
                secretKeyRef:
                  name: sahyog-secrets
                  key: S3_ACCESS_KEY
            - name: S3PROXY_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: sahyog-secrets
                  key: S3_SECRET_KEY
            - name: S3PROXY_CORS_ALLOW_ALL
              value: "false"
            - name: JCLOUDS_PROVIDER
              value: filesystem
            - name: JCLOUDS_FILESYSTEM_BASEDIR
              value: /data
            - name: JCLOUDS_REGIONS
              valueFrom:
                configMapKeyRef:
                  name: sahyog-config
                  key: S3_REGION
                  optional: true
            - name: LOG_LEVEL
              value: info
          ports:
            - name: s3
              containerPort: 80
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:80/); test \"$code\" = 403 -o \"$code\" = 200"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:80/); test \"$code\" = 403 -o \"$code\" = 200"
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-init
  labels:
    app.kubernetes.io/name: s3-init
    app.kubernetes.io/part-of: sahyog
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-init
        app.kubernetes.io/part-of: sahyog
    spec:
      restartPolicy: OnFailure
      serviceAccountName: sahyog-workload
      automountServiceAccountToken: false
      containers:
        - name: s3-init
          image: amazon/aws-cli:2.22.12
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/init/s3-init.sh"]
          envFrom:
            - secretRef:
                name: sahyog-secrets
            - configMapRef:
                name: sahyog-config
          env:
            - name: S3_ENDPOINT_URL
              value: http://s3proxy:80
          volumeMounts:
            - name: init
              mountPath: /init
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: init
          configMap:
            name: s3-init
            defaultMode: 0755
            items:
              - key: s3-init.sh
                path: s3-init.sh

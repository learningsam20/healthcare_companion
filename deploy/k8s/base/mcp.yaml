# Internal MCP services. The broker validates the signed _context before forwarding;
# the app never calls a leaf MCP service directly. Each service is independently
# scalable and exposes only /healthz plus its declared MCP transport.
apiVersion: v1
kind: Service
metadata:
  name: mcp-broker
  labels:
    app.kubernetes.io/name: mcp-broker
    app.kubernetes.io/part-of: sahyog
    sahyog.io/zone: ai
spec:
  selector:
    app.kubernetes.io/name: mcp-broker
  ports:
    - name: http
      port: 8100
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-broker
  labels:
    app.kubernetes.io/name: mcp-broker
    app.kubernetes.io/part-of: sahyog
    sahyog.io/zone: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-broker
        app.kubernetes.io/part-of: sahyog
        sahyog.io/zone: ai
    spec:
      serviceAccountName: sahyog-workload
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: sahyog-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "sahyog_mcp_broker.main:app", "--host", "0.0.0.0", "--port", "8100"]
          envFrom:
            - configMapRef:
                name: sahyog-config
          env:
            - name: MCP_CONTEXT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sahyog-secrets
                  key: MCP_CONTEXT_SECRET
            - name: MCP_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sahyog-secrets
                  key: MCP_SERVICE_TOKEN
          ports:
            - name: http
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---

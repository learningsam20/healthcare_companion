# ScheduleAnyway keeps the overlay deployable on a single-node cluster while
# still preferring separation when nodes are available.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
---
apiVersion: apps/v1
kind: Deployment

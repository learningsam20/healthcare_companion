apiVersion: v1
kind: ConfigMap
metadata:
  name: sahyog-config
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  # Mailpit is removed in this overlay. Email and SMS remain unconfigured until
  # the client supplies an approved SMTP relay or provider; they never fall back
  # to a mock. Set these keys in an operator-owned overlay patch when approved.
  SMTP_HOST: ""
  SMTP_AUTH_MODE: password
  SMTP_USE_STARTTLS: "true"
  NOTIFY_SEND_EXTERNAL: "false"

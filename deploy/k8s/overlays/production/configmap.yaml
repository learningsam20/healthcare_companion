apiVersion: v1
kind: ConfigMap
metadata:
  name: sahyog-config
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  # Mailpit is removed in this overlay. Email stays unconfigured until an
  # approved SMTP relay is set in this ConfigMap; adapters fail closed and never
  # fall back to a mock. External delivery is on so configured Slack and SMTP send.
  SMTP_HOST: ""
  SMTP_AUTH_MODE: password
  SMTP_USE_STARTTLS: "true"
  NOTIFY_SEND_EXTERNAL: "true"

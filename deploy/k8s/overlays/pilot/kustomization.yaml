apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Single-site pilot. No HA or multi-zone claim: one replica per workload,
# local-path style storage classes are acceptable only for synthetic data.
namespace: sahyog

resources:
  - ../../base
  - ingress.yaml

components:
  - ../../components/observability
  - ../../components/local-model

# The images are built from this repository and pinned by tag. Use
# `./scripts/k8s-deploy.sh --api-image <ref> --web-image <ref>` to override
# without editing this file.
images:
  - name: sahyog-api
    newTag: 0.1.0
  - name: sahyog-web
    newTag: 0.1.0

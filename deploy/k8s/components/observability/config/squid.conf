# Local egress proxy for the full profile. It is not wired into the application by
# default; production egress is an explicit allowlist at the network layer. This file
# is a starting point for proving provider egress through one controlled hop.
acl allowed_egress dstdomain .openrouter.ai .slack.com .google.com .gmail.com
acl localnet src 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

http_access allow localnet allowed_egress
http_access deny all
http_port 3128

access_log stdio:/dev/stdout
cache_log /dev/stderr
cache deny all

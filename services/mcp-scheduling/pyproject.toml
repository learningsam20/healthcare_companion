[project]
name = "sahyog-mcp-scheduling"
version = "0.1.0"
description = "MCP scheduling tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sahyog-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sahyog_mcp_scheduling"]

[tool.uv.sources]
sahyog-common = { workspace = true }

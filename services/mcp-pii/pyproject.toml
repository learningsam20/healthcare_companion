[project]
name = "sahyog-mcp-pii"
version = "0.1.0"
description = "MCP PII detection and redaction service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "presidio-analyzer>=2.2,<3",
  "gliner>=0.2,<1",
  "spacy>=3.7,<4",
  "sahyog-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sahyog_mcp_pii"]

[tool.uv.sources]
sahyog-common = { workspace = true }

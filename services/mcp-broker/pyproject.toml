[project]
name = "sahyog-mcp-broker"
version = "0.1.0"
description = "Signed-context MCP broker and tool allowlist enforcement point"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0,<7",
  "sahyog-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sahyog_mcp_broker"]

[tool.uv.sources]
sahyog-common = { workspace = true }

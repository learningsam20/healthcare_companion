[project]
name = "sahyog-mcp-decider"
version = "0.1.0"
description = "MCP deterministic intent and red-flag decision service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "sahyog-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sahyog_mcp_decider"]

[tool.uv.sources]
sahyog-common = { workspace = true }

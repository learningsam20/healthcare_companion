[project]
name = "sahyog-api"
version = "0.1.0"
description = "Sahyog Care Companion modular monolith API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.27,<1",
  "pyyaml>=6.0,<7",
  "redis>=5.2,<6",
  "arq>=0.26,<1",
  "python-multipart>=0.0.17,<1",
  "boto3>=1.35,<2",
  "pgvector>=0.3,<1",
  "pypdf>=5.1,<6",
  "reportlab>=4.2,<5",
  "aiosmtplib>=3.0,<4",
  "langgraph>=0.2.60,<1",
  "langgraph-checkpoint-postgres>=2.0,<3",
  # Binary wheel bundles libpq so host/--local works without system libpq (Docker hotfix uses the same).
  "psycopg[binary,pool]>=3.2,<4",
  "langchain-core>=0.3.30,<1",
  "jsonschema>=4.23,<5",
  "sahyog-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
sahyog-common = { workspace = true }

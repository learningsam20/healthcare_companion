# Approved, non-clinical notification copy. No patient names, clinical detail,
# or access tokens. Operational attachments (ICS / ticket briefs) are built
# separately and must also stay free of PHI.
# subject_detail is appended to subject as " — {detail}" when non-empty.
# The plain body is composed from intro, facts, footer and action_url so
# in-app, email text and Slack fallback stay aligned with the rich layout.
version: 1
templates:
  booking_confirmed:
    en:
      subject: "Appointment confirmed"
      subject_detail: "{doctor_name} · {starts_at} · {clinic_code}"
      action_label: "Open appointment"
      intro: "Your appointment is confirmed."
      footer: "A calendar file is attached to this email. Open the appointment if you need to reschedule or cancel. This message has no clinical notes."
      facts:
        - { label: Doctor, key: doctor_name }
        - { label: When, key: starts_at }
        - { label: Clinic, key: clinic_code }
        - { label: Duration, key: duration_minutes, suffix: " minutes" }
        - { label: Reference, key: appointment_id_short }
    hi:
      subject: "अपॉइंटमेंट पक्का हुआ"
      subject_detail: "{doctor_name} · {starts_at} · {clinic_code}"
      action_label: "अपॉइंटमेंट खोलें"
      intro: "आपका अपॉइंटमेंट पक्का हो गया है।"
      footer: "इस ईमेल के साथ कैलेंडर फ़ाइल (.ics) जुड़ी हो सकती है। समय बदलने या रद्द करने के लिए अपॉइंटमेंट खोलें। इस संदेश में कोई क्लिनिकल नोट नहीं है।"
      facts:
        - { label: डॉक्टर, key: doctor_name }
        - { label: समय, key: starts_at }
        - { label: क्लिनिक, key: clinic_code }
        - { label: अवधि, key: duration_minutes, suffix: " मिनट" }
        - { label: संदर्भ, key: appointment_id_short }
    mr:
      subject: "अपॉइंटमेंट निश्चित झाली"
      subject_detail: "{doctor_name} · {starts_at} · {clinic_code}"
      action_label: "अपॉइंटमेंट उघडा"
      intro: "तुमची अपॉइंटमेंट निश्चित झाली आहे."
